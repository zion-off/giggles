name: documentation / cd

on:
  workflow_run:
    workflows: ['documentation / ci']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    uses: zion-off/workflows/.github/workflows/deploy.yml@main
    with:
      node-version: '20'
      build: bash scripts/build-docs.sh
      build-output: |
        documentation/dist
        documentation/.open-next/assets
      environment: docs
